name: Deploy

# Manual: só funciona se os secrets DATABRICKS_HOST e DATABRICKS_TOKEN existirem.
# Na Free Edition, faça o deploy local com `databricks bundle deploy -t free`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # sem aprovação manual: ambiente único
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t free
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
